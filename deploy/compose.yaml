services:
  api:
    image: ghcr.io/leoaguinaga/parkingflow-api:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      PORT: 8080
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
