spring.application.name=api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/parkflow}
spring.datasource.username=${DATABASE_USERNAME:parkflow_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.user=${DATABASE_MIGRATION_USERNAME:${DATABASE_USERNAME:parkflow_app}}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD:}}
server.port=${PORT:8080}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
management.endpoints.web.exposure.include=health
